  <style>
    :root {
      --bg: #FAF7F2;
      --bg-elevated: #F3EBE3;
      --surface: rgba(255,255,255,0.92);
      --border: rgba(30,77,107,0.18);
      --text: #3D3028;
      --muted: #5C6574;
      --marine: #1E4D6B;
      --navy: #152238;
      --navy-mid: #243652;
      --navy-deep: #0C1220;
      --azzurro: #4A7FA8;
      --terracotta: #C0714F;
      --gold: #B8864F;
      --teal: #4A7FA8;
      --accent: linear-gradient(135deg, #C0714F 0%, #1E4D6B 55%, #152238 100%);
      --radius: 20px;
      --shadow: 0 20px 50px rgba(21,34,56,0.14);
      --font: 'Inter', system-ui, sans-serif;
      --display: 'Playfair Display', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      overflow-x: hidden;
    }
    .mesh {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 92% 18%, rgba(21,34,56,0.10), transparent 58%),
        radial-gradient(ellipse 70% 50% at 15% 10%, rgba(192,113,79,0.10), transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 20%, rgba(74,127,168,0.12), transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(30,77,107,0.08), transparent 55%),
        linear-gradient(180deg, #FAF7F2 0%, #F0E8DE 100%);
    }
    .container { width: min(1140px, 92vw); margin: 0 auto; }
    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    .nav {
      position: sticky; top: 5.1rem; z-index: 200;
      backdrop-filter: blur(16px) saturate(1.2);
      background: linear-gradient(180deg, rgba(250,247,242,0.92) 0%, rgba(243,235,227,0.88) 100%);
      border-bottom: 1px solid rgba(21,34,56,0.12);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 0.9rem 0;
    }
    .logo {
      display: inline-flex; align-items: center;
      text-decoration: none;
    }
    .logo__mark {
      height: 46px; width: auto; border-radius: 12px;
      box-shadow: 0 4px 14px rgba(30,77,107,0.12), 0 0 0 1px rgba(30,77,107,0.10);
    }
    .logo em {
      font-style: normal;
      background: var(--accent);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .nav-links { display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap; }
    .nav-links a {
      color: var(--muted); font-size: 0.88rem; text-decoration: none; transition: color .2s;
    }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    .nav-shop {
      padding: 0.45rem 0.95rem; border-radius: 999px;
      background: linear-gradient(135deg, #C0714F 0%, #1E4D6B 100%);
      color: #FAF7F2 !important; font-weight: 600;
    }
    .nav-shop:hover { opacity: 0.92; color: #FAF7F2 !important; }
    .lang-toggle { display: flex; flex-wrap: wrap; gap: 4px; max-width: 11rem; justify-content: flex-end; }
    .lang-btn {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      padding: 0.3rem 0.55rem; border-radius: 8px; cursor: pointer; font-size: 0.72rem;
    }
    .lang-btn.active { border-color: var(--gold); color: var(--gold); }
    .menu-btn {
      display: none; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 0.45rem 0.7rem; border-radius: 10px; cursor: pointer;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.85rem 1.5rem; border-radius: 999px; font-weight: 600; font-size: 0.95rem;
      border: none; cursor: pointer; text-decoration: none; transition: transform .2s, box-shadow .2s;
    }
    .btn:hover { transform: translateY(-2px); text-decoration: none; }
    .btn-primary {
      background: var(--accent); color: #FAF7F2;
      box-shadow: 0 8px 24px rgba(192,113,79,0.22);
    }
    #luckySpinBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.75); color: var(--marine);
      border: 1px solid var(--border);
    }
    .btn-lg { padding: 1rem 2rem; font-size: 1.05rem; }

    .pitch-shop-banner {
      position: sticky; top: 0; z-index: 300;
      background:
        radial-gradient(ellipse 80% 120% at 12% 0%, rgba(192,113,79,0.12), transparent 55%),
        radial-gradient(ellipse 60% 80% at 100% 0%, rgba(21,34,56,0.08), transparent 50%),
        linear-gradient(180deg, #FAF7F2 0%, #E8EEF3 100%);
      color: var(--text);
      border-bottom: 1px solid rgba(21,34,56,0.14);
      font-size: 0.875rem;
      box-shadow: 0 8px 24px rgba(21,34,56,0.08);
    }
    .pitch-shop-banner-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; padding: 0.75rem 0;
    }
    .pitch-shop-banner-brand {
      display: flex; align-items: center; flex-shrink: 0;
    }
    .pitch-shop-banner-logo {
      height: 62px; width: auto; border-radius: 14px;
      box-shadow: 0 6px 18px rgba(30,77,107,0.12), 0 0 0 1px rgba(30,77,107,0.10);
    }
    .pitch-shop-banner-main {
      display: flex; align-items: center; gap: 1rem; flex: 1; flex-wrap: wrap;
      justify-content: space-between; min-width: min(100%, 20rem);
    }
    .pitch-shop-banner-where { display: flex; flex-direction: column; gap: 0.15rem; min-width: min(100%, 20rem); }
    .pitch-shop-banner-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gold);
    }
    .pitch-shop-banner-title { font-size: 1rem; color: var(--text); font-weight: 600; }
    .pitch-shop-banner-note { font-size: 0.8rem; color: var(--muted); max-width: 36rem; }
    .pitch-shop-banner-cta {
      display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0.1rem;
      padding: 0.6rem 1.05rem; border-radius: 12px;
      background: linear-gradient(135deg, #C0714F 0%, #8F4528 100%);
      color: #FAF7F2 !important;
      text-decoration: none !important; font-weight: 700; font-size: 0.9rem; white-space: nowrap;
      box-shadow: 0 4px 18px rgba(212,185,120,0.28);
    }
    .pitch-shop-banner-cta small { font-size: 0.68rem; font-weight: 600; opacity: 0.88; color: rgba(250,247,242,0.92); }
    .pitch-shop-banner-cta:hover {
      background: linear-gradient(135deg, #D4896A 0%, #1E4D6B 100%);
      color: #FAF7F2 !important; text-decoration: none !important;
      transform: translateY(-1px);
    }

    .pitch-context {
      margin-bottom: 1.25rem; padding: 1rem 1.15rem; border-radius: 14px;
      border: 1px solid rgba(21,34,56,0.14);
      border-left: 3px solid var(--navy);
      background: linear-gradient(135deg, rgba(255,255,255,0.82) 0%, rgba(232,238,243,0.55) 100%);
      max-width: 34rem;
    }
    .pitch-context strong {
      display: block; color: var(--gold); font-size: 0.85rem; letter-spacing: 0.04em;
      text-transform: uppercase; margin-bottom: 0.35rem;
    }
    .pitch-context p { margin: 0; font-size: 0.9rem; color: var(--muted); line-height: 1.55; }

    /* Hero */
    .hero { padding: 5rem 0 4rem; }
    .hero-grid {
      display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 3rem; align-items: center;
    }
    .badge {
      display: inline-block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--gold); border: 1px solid rgba(30,77,107,0.18);
      padding: 0.4rem 0.85rem; border-radius: 999px; margin-bottom: 1.25rem;
    }
    .hero h1 {
      font-family: var(--display); font-size: clamp(2.2rem, 4.5vw, 3.6rem);
      line-height: 1.12; margin-bottom: 1.25rem; letter-spacing: -0.02em;
    }
    .hero .lead { color: var(--muted); font-size: 1.08rem; max-width: 34rem; }
    .hero-cta { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
    .hero-pitch-hint { margin-top: 1rem; font-size: 0.875rem; color: var(--muted); max-width: 34rem; }
    .btn-shop {
      background: rgba(30, 77, 107, 0.10); color: var(--marine);
      border: 1px solid rgba(30, 77, 107, 0.28);
    }
    .btn-shop:hover { background: rgba(21, 34, 56, 0.12); border-color: rgba(21, 34, 56, 0.28); }
    .hero-visual {
      position: relative; width: 100%;
      min-height: 380px; aspect-ratio: 4 / 5; max-height: 480px;
      border-radius: var(--radius); overflow: hidden;
      border: 1px solid rgba(21,34,56,0.16);
      box-shadow: 0 24px 60px rgba(21,34,56,0.16), 0 0 0 1px rgba(30,77,107,0.08);
      background: var(--navy);
      isolation: isolate;
    }
    .hero-visual__photo {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      display: block;
    }
    .hero-visual__overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(
        180deg,
        rgba(21,34,56,0.18) 0%,
        transparent 42%,
        rgba(21,34,56,0.35) 100%
      );
      pointer-events: none;
    }
    .hero-visual__content {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 0 2.75rem;
    }
    .hero-visual__logo {
      width: min(52%, 200px); height: auto; border-radius: 18px;
      margin: 0 auto;
      box-shadow: 0 18px 40px rgba(12,18,32,0.32), 0 0 0 1px rgba(255,255,255,0.42);
    }
    .hero-visual__tagline {
      position: absolute; left: 0; right: 0; bottom: 0;
      margin: 0; font-size: 0.78rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: #FAF7F2; font-weight: 600; text-align: center;
      padding: 0.55rem 0.85rem; border-radius: 0 0 calc(var(--radius) - 4px) calc(var(--radius) - 4px);
      background: linear-gradient(180deg, rgba(21,34,56,0.55) 0%, rgba(21,34,56,0.78) 100%);
      text-shadow: 0 1px 3px rgba(12,18,32,0.45);
    }

    /* Lucky Luck Slot */
    .lucky-slot-wrap {
      max-width: 680px; margin: 0 auto 2rem;
      padding: 2rem 1.5rem 1.75rem;
      text-align: center;
    }
    .lucky-slot-badge {
      display: inline-block; font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--gold);
      border: 1px solid rgba(30,77,107,0.18);
      padding: 0.35rem 0.75rem; border-radius: 999px; margin-bottom: 1rem;
    }
    .lucky-slot-machine {
      display: flex; justify-content: center; flex-wrap: nowrap;
      gap: 0.45rem; margin: 1.5rem 0 1.25rem;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding: 0 0.25rem;
    }
    .lucky-reel {
      width: 72px; height: 96px; border-radius: 12px; flex-shrink: 0;
      --lucky-item-h: 88px;
      --lucky-reel-h: 96px;
      background: #F3EBE3;
      border: 2px solid rgba(212,185,120,0.28);
      box-shadow: inset 0 0 24px rgba(30,77,107,0.08), 0 8px 24px rgba(30,77,107,0.10);
      overflow: hidden; position: relative;
    }
    .lucky-reel__inner {
      display: flex; flex-direction: column; align-items: center;
      will-change: transform;
    }
    .lucky-reel img {
      width: 64px; height: 64px; margin: 12px 4px;
      border-radius: 10px; object-fit: cover; object-position: center; flex-shrink: 0;
    }
    .lucky-reel img.is-contain {
      object-fit: contain; background: #F3EBE3;
    }
    .lucky-slot-result {
      min-height: 1.5rem; font-size: 0.95rem; color: var(--gold);
      margin-bottom: 1rem; font-weight: 600;
    }
    .lucky-slot-result.is-muted { color: var(--muted); font-weight: 500; }
    .lucky-slot-result.is-win { color: var(--gold); font-weight: 700; }
    .lucky-slot-cta { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .lucky-slot-prize {
      font-size: 0.9rem; color: var(--gold); font-weight: 600;
      margin: 0.25rem 0 0.75rem; letter-spacing: 0.02em;
    }
    .lucky-slot-disclaimer {
      margin-top: 1rem; font-size: 0.75rem; color: var(--muted); line-height: 1.45;
    }
    .lucky-slot-daily {
      margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); line-height: 1.45;
    }

    /* Sections */
    section { padding: 4.5rem 0; }
    section.alt { background: linear-gradient(180deg, rgba(232,238,243,0.55) 0%, rgba(243,235,227,0.72) 100%); border-y: 1px solid var(--border); }
    .section-title {
      font-family: var(--display); font-size: clamp(1.8rem, 3vw, 2.4rem);
      text-align: center; margin-bottom: 0.75rem;
    }
    .section-sub { text-align: center; color: var(--muted); max-width: 38rem; margin: 0 auto 2.5rem; }
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s; }
    .reveal.visible { opacity: 1; transform: none; }

    .glass {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.75rem; backdrop-filter: blur(12px);
      transition: border-color .25s, transform .25s;
    }
    .glass:hover { border-color: rgba(30,77,107,0.22); transform: translateY(-3px); box-shadow: var(--shadow); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .pain { border-color: rgba(255,100,100,0.2); }
    .solution { border-color: rgba(62,232,211,0.25); }
    .two-col h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .two-col ul { padding-left: 1.2rem; color: var(--muted); }
    .two-col li { margin-bottom: 0.5rem; }

    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .showcase-card .thumb {
      border-radius: 14px; overflow: hidden; border: 1px solid var(--border);
      margin-bottom: 1rem; aspect-ratio: 4/3; background: var(--bg-elevated);
    }
    .showcase-card .thumb img {
      display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center;
    }
    .showcase-card h3 { margin-bottom: 0.5rem; }
    .showcase-card p { color: var(--muted); font-size: 0.9rem; }

    .feature-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;
    }
    .feature-grid h3 { color: var(--gold); font-size: 0.95rem; margin-bottom: 0.4rem; }
    .feature-grid p { color: var(--muted); font-size: 0.88rem; }

    .strategy-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;
    }
    .strategy-item {
      padding: 1.25rem 1.25rem 1.25rem 1.5rem;
      border-left: 3px solid var(--teal); background: var(--surface); border-radius: 0 14px 14px 0;
    }
    .strategy-item h3 { font-size: 1rem; margin-bottom: 0.35rem; }
    .strategy-item p { color: var(--muted); font-size: 0.88rem; }

    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .metric-val {
      font-size: 2.2rem; font-weight: 700;
      background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .metric-label { font-weight: 600; margin-top: 0.35rem; }
    .metric-note { font-size: 0.8rem; color: var(--muted); }

    .testimonial { max-width: 720px; margin: 0 auto; text-align: center; }
    .testimonial q { display: block; font-size: 1.15rem; font-style: italic; line-height: 1.6; }
    .testimonial cite { display: block; margin-top: 1rem; color: var(--muted); font-style: normal; }
    .live-badge {
      display: inline-block; margin-top: 1rem; font-size: 0.75rem; color: var(--teal);
      border: 1px solid rgba(62,232,211,0.35); padding: 0.3rem 0.75rem; border-radius: 999px;
      text-decoration: none; cursor: pointer;
    }
    .live-badge:hover { background: rgba(62,232,211,0.12); }

    /* Plan cards */
    .plan-cards {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem;
    }
    .plan-card {
      text-align: center; padding: 1.5rem 1rem; position: relative;
    }
    .plan-card.featured { border-color: rgba(212,185,120,0.45); }
    .plan-card.featured::before {
      content: 'Beliebt'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #FAF7F2; font-size: 0.65rem; font-weight: 700;
      padding: 0.2rem 0.65rem; border-radius: 999px; letter-spacing: 0.04em;
    }
    .plan-name { font-weight: 700; font-size: 1.1rem; }
    .plan-price { font-size: 2rem; font-weight: 700; color: var(--gold); margin: 0.5rem 0; }
    .plan-price small { font-size: 0.85rem; color: var(--muted); font-weight: 400; }

    .plan-toggle { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.25rem; }
    .plan-toggle button {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 0.5rem 1.2rem; border-radius: 999px; cursor: pointer;
    }
    .plan-toggle button.active { border-color: var(--gold); color: var(--gold); }

    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--border); text-align: center; }
    th:first-child, td:first-child { text-align: left; min-width: 160px; }
    thead th { background: rgba(243,235,227,0.9); }
    td.yes { color: var(--teal); font-weight: 600; }
    td.no { color: var(--muted); }
    .plan-head-price { color: var(--gold); font-size: 0.85rem; }

    /* Demo */
    .demo-tabs { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .demo-tabs button {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 0.55rem 1.3rem; border-radius: 999px; cursor: pointer;
    }
    .demo-tabs button.active { border-color: var(--teal); color: var(--teal); }

    function resolvePitchLang() {
      try {

      const code = (navigator.language || 'en').slice(0, 2).toLowerCase();
      if (PITCH_LANGS.includes(code)) return code;
      return 'en';

    const LUCKY_SPINS_KEY = 'luckyLukeSlotSpins';

    function pickLandingSymbol() {
      if (Math.random() < LUCKY_LUKE_WEIGHT) return 'luke';
      const others = ['pferd', 'klee', 'kaktus'];
      return others[Math.floor(Math.random() * others.length)];
    }

    function randomSymbolKey() {
      return LUCKY_SYMBOL_KEYS[Math.floor(Math.random() * LUCKY_SYMBOL_KEYS.length)];
    }

    function spinResult5() {
      return Array.from({ length: LUCKY_REEL_COUNT }, () => pickLandingSymbol());
    }

    function isWin(result) {
      return lukeCount(result) >= LUCKY_REEL_COUNT;
    }

    function lukeCount(result) {
      return result.filter((k) => k === 'luke').length;
    }

    function storeLuckyWin() {
      try {
        localStorage.setItem(LUCKY_WIN_KEY, JSON.stringify({ date: todayKey() }));
      } catch (_) { /* ignore */ }
    }

    function hasStoredLuckyWinToday() {
      try {
        const raw = localStorage.getItem(LUCKY_WIN_KEY);
        if (!raw) return false;
        const { date } = JSON.parse(raw);
        return date === todayKey();
      } catch (_) {
        return false;
      }
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getDailySpinLimit() {
      return LUCKY_DAILY_SPIN_LIMIT;
    }

    function getSpinsUsedToday() {
      try {
        const raw = localStorage.getItem(LUCKY_SPINS_KEY);
        if (!raw) return 0;
        const { date, count } = JSON.parse(raw);
        return date === todayKey() ? count : 0;
      } catch (_) {
        return 0;
      }
    }

    function incrementSpinsUsedToday() {
      try {
        localStorage.setItem(LUCKY_SPINS_KEY, JSON.stringify({
          date: todayKey(),
          count: getSpinsUsedToday() + 1,
        }));
      } catch (_) { /* ignore */ }
    }

    function spinsRemainingToday() {
      return Math.max(0, getDailySpinLimit() - getSpinsUsedToday());
    }

    function canSpinToday() {
      return spinsRemainingToday() > 0;
    }

    function getMessageKeyForResult(result) {
      if (isWin(result)) return 'slot.winMessage';
      const count = lukeCount(result);
      if (count === 4) return 'slot.nearLuke';
      if (count === 3) return 'slot.nearLuke3';
      if (count === 2) return 'slot.nearMiss';
      if (count === 1) return 'slot.nearMiss1';
      return 'slot.tryAgain';
    }

    function storeLastResult(messageKey, won) {
      try {
        localStorage.setItem(LUCKY_LAST_RESULT_KEY, JSON.stringify({
          date: todayKey(),
          messageKey,
          won,
        }));
      } catch (_) { /* ignore */ }
    }

    function getLastResultToday() {
      try {
        const raw = localStorage.getItem(LUCKY_LAST_RESULT_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return data.date === todayKey() ? data : null;
      } catch (_) {
        return null;
      }
    }

    function syncLuckySlotUi() {
      const btn = document.getElementById('luckySpinBtn');
      const resultEl = document.getElementById('luckySlotResult');
      if (!btn || !resultEl) return;

      const t = I18N[lang] || I18N.de;

      if (hasStoredLuckyWinToday()) {
        resultEl.textContent = t['slot.winMessage'];
        resultEl.classList.remove('is-muted');
        resultEl.classList.add('is-win');
        btn.disabled = true;
        return;
      }

      if (!canSpinToday()) {
        const last = getLastResultToday();
        resultEl.textContent = last && last.messageKey
          ? (t[last.messageKey] || t['slot.noSpinsLeft'])
          : t['slot.noSpinsLeft'];
        resultEl.classList.toggle('is-muted', !last?.won);
        resultEl.classList.toggle('is-win', !!last?.won);
        btn.disabled = true;
        return;
      }

      resultEl.textContent = t['slot.hint'];
      resultEl.classList.add('is-muted');
      resultEl.classList.remove('is-win');
      btn.disabled = false;
    }

    function luckyReelHtml(key) {
      const s = LUCKY_SYMBOLS[key] || LUCKY_SYMBOLS.luke;
      return `<img src="${s.src}" alt="${s.alt}" width="64" height="64" loading="lazy" />`;
    }

    function translateForLandIndex(landIndex) {
      return landIndex * LUCKY_ITEM_H - (LUCKY_REEL_VIEW_H - LUCKY_ITEM_H) / 2;
    }

    function buildReelStripKeys(landKey, reelIndex) {
      const len = LUCKY_STRIP_MIN + reelIndex * 2 + Math.floor(Math.random() * 6);
      const keys = [];
      for (let i = 0; i < len; i++) keys.push(randomSymbolKey());
      keys.push(landKey);
      return keys;
    }

    function setReelStrip(inner, keys, offsetY, transition) {
      inner.innerHTML = keys.map((key) => luckyReelHtml(key)).join('');
      inner.style.transition = transition || 'none';
      inner.style.transform = `translateY(-${offsetY}px)`;
    }

    function initReelIdle(inner, reelIndex) {
      const key = LUCKY_SYMBOL_KEYS[reelIndex % LUCKY_SYMBOL_KEYS.length];
      setReelStrip(inner, [key], translateForLandIndex(0), 'none');
    }

    function spinReelToLand(inner, landKey, reelIndex, delayMs) {
      const keys = buildReelStripKeys(landKey, reelIndex);
      const landIndex = keys.length - 1;
      const targetY = translateForLandIndex(landIndex);
      const durationSec = 0.75 + reelIndex * 0.12;

      setReelStrip(inner, keys, 0, 'none');
      void inner.offsetHeight;

      return new Promise((resolve) => {
        window.setTimeout(() => {
          inner.style.transition = `transform ${durationSec}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
          inner.style.transform = `translateY(-${targetY}px)`;
          window.setTimeout(resolve, durationSec * 1000 + 40);
        }, delayMs);
      });
    }

    function luckyResultMessage(result, t) {
      return t[getMessageKeyForResult(result)] || t['slot.tryAgain'];
    }

    function initLuckyLookSlot() {
      const btn = document.getElementById('luckySpinBtn');
      const resultEl = document.getElementById('luckySlotResult');
      if (!btn || !resultEl) return;

      for (let i = 0; i < LUCKY_REEL_COUNT; i++) {
        const inner = document.getElementById('luckyReelInner' + i);
        if (inner) initReelIdle(inner, i);
      }

      syncLuckySlotUi();

      let spinning = false;
      btn.addEventListener('click', () => {
        if (spinning || !canSpinToday()) return;
        spinning = true;
        btn.disabled = true;
        const t = I18N[lang] || I18N.de;
        resultEl.textContent = '…';
        resultEl.classList.add('is-muted');
        resultEl.classList.remove('is-win');

        const result = spinResult5();
        const landPromises = result.map((landKey, i) => {
          const inner = document.getElementById('luckyReelInner' + i);
          if (!inner) return Promise.resolve();
          return spinReelToLand(inner, landKey, i, i * LUCKY_REEL_STAGGER_MS);
        });

        Promise.all(landPromises).then(() => {
          incrementSpinsUsedToday();
          const won = isWin(result);
          const messageKey = getMessageKeyForResult(result);
          if (won) storeLuckyWin();
          storeLastResult(messageKey, won);
          resultEl.textContent = t[messageKey] || t['slot.tryAgain'];
          resultEl.classList.toggle('is-muted', !won);
          resultEl.classList.toggle('is-win', won);
          spinning = false;
          syncLuckySlotUi();
        });
      });
    }

    initLuckyLookSlot();

    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('open');
    });

    const RENT_API = 'https://us-central1-collectionshop-2854d.cloudfunctions.net/api/v1/platform-leads';
    const RENT_CHECKOUT = 'https://us-central1-collectionshop-2854d.cloudfunctions.net/createCheckoutSession';

    function t(key) {
      const pack = I18N[lang] || I18N.de;
      return pack[key] || I18N.de[key] || key;
    }

    function collectLeadPayload(form) {
      const fd = new FormData(form);
      return {
        website: String(fd.get('website') || ''),
        name: String(fd.get('name') || '').trim(),
        email: String(fd.get('email') || '').trim(),
        plan: String(fd.get('plan') || 'simply'),
        shopName: String(fd.get('shopName') || '').trim(),
        note: String(fd.get('note') || '').trim(),
      };
    }

    const inquiryForm = document.getElementById('inquiryForm');
    if (inquiryForm) {
      inquiryForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById('inquiryMsg');
        const btn = document.getElementById('inquirySubmit');
        const payload = collectLeadPayload(inquiryForm);
        payload.intent = 'inquiry';
        if (payload.note) payload.note = '[ANFRAGE] ' + payload.note;
        else payload.note = '[ANFRAGE] Unverbindliche Tarif-Anfrage';
        if (!payload.email.includes('@')) {
          msgEl.hidden = false;
          msgEl.className = 'rent-msg is-err';
          msgEl.textContent = t('inquiry.error');
          return;
        }
        btn.disabled = true;
        msgEl.hidden = true;
        try {
          const leadRes = await fetch(RENT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const lead = await leadRes.json().catch(() => ({}));
          if (!leadRes.ok) throw new Error(lead.error || 'fail');
          msgEl.hidden = false;
          msgEl.className = 'rent-msg is-ok';
          msgEl.textContent = t('inquiry.ok');
          inquiryForm.reset();
        } catch {
          msgEl.hidden = false;
          msgEl.className = 'rent-msg is-err';
          msgEl.textContent = t('inquiry.error');
        } finally {
          btn.disabled = false;
        }
      });
    }

    const rentForm = document.getElementById('rentForm');
    const rentPaid = new URLSearchParams(location.search).get('paid');
    const rentCanceled = new URLSearchParams(location.search).get('canceled');
    if (rentForm && (rentPaid === '1' || rentCanceled === '1')) {
      const msgEl = document.getElementById('rentMsg');
      const pack = I18N[lang] || I18N.de;
      msgEl.hidden = false;
      if (rentPaid === '1') {
        msgEl.className = 'rent-msg is-ok';
        msgEl.textContent = pack['rent.ok'];
      } else {
        msgEl.className = 'rent-msg is-err';
        msgEl.textContent = pack['rent.canceled'] || pack['rent.error'];
      }
    }
    if (rentForm) {
      rentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById('rentMsg');
        const btn = document.getElementById('rentSubmit');
        const pack = I18N[lang] || I18N.de;
        const fd = new FormData(rentForm);
        const payload = {
          website: String(fd.get('website') || ''),
          name: String(fd.get('name') || '').trim(),
          email: String(fd.get('email') || '').trim(),
          plan: String(fd.get('plan') || 'simply'),
          shopName: String(fd.get('shopName') || '').trim(),
          note: String(fd.get('note') || '').trim(),
        };
        if (!payload.email.includes('@')) {
          msgEl.hidden = false;
          msgEl.className = 'rent-msg is-err';
          msgEl.textContent = pack['rent.error'];
          return;
        }
        btn.disabled = true;
        msgEl.hidden = true;
        try {
          const leadRes = await fetch(RENT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const lead = await leadRes.json().catch(() => ({}));
          if (!leadRes.ok) throw new Error(lead.error || 'fail');
          if (!lead.slug) throw new Error('fail');
          const payRes = await fetch(RENT_CHECKOUT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              planId: payload.plan,
              ownerEmail: payload.email,
              tenantSlug: lead.slug || '',
              shopName: payload.shopName || payload.name,
              successUrl: 'https://code-und-grow.de/pitch/?paid=1#mieten',
              cancelUrl: 'https://code-und-grow.de/pitch/?canceled=1#mieten',
            }),
          });
          const pay = await payRes.json().catch(() => ({}));
          if (!payRes.ok || !pay.url) throw new Error(pay.error || 'fail');
          window.location.href = pay.url;
          return;
        } catch {
          msgEl.hidden = false;
          msgEl.className = 'rent-msg is-err';
          msgEl.textContent = pack['rent.error'];
        } finally {
          btn.disabled = false;
        }
      });
    }

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    applyI18n();
    setTimeout(revealAllSections, 400);
  </script>
</body>
</html>
