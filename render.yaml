# TaxiApp Backend — Deploy auf Render.com
# https://render.com/docs/blueprint-spec
#
# 1. Repo auf GitHub pushen
# 2. render.com → New → Blueprint → dieses Repo wählen
# 3. STRIPE_SECRET_KEY im Dashboard setzen (Environment)
# 4. Nach Deploy: HTTPS-URL in TaxiConfig.swift → cloudBackendURL

services:
  - type: web
    name: taxiapp-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: STRIPE_SECRET_KEY
        sync: false
    # Persistent Disk (empfohlen ab Starter-Plan — Buchungen bleiben nach Deploy):
    # disk:
    #   name: taxiapp-data
    #   mountPath: /var/data
    #   sizeGB: 1
