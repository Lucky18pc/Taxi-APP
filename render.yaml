# TaxiApp Backend — Deploy auf Render.com (Go-Live-Plattform)
# Firebase: Fahrer Auth/Firestore clientseitig; Backend bleibt Node/Express (Phase 1).
# Optional Env: GOOGLE_MAPS_BROWSER_KEY, TWILIO_*, LOCATION_STREAM_INTERVAL_MS
# https://render.com/docs/blueprint-spec
#
# 1. Repo auf GitHub pushen → Render deployt automatisch
# 2. Dashboard → taxiapp-api → Environment:
#    ADMIN_PIN=deine-pin          (Leitstelle schützen)
#    STRIPE_SECRET_KEY=sk_test_…  (optional, Kartenzahlung später)
# 3. iOS: TaxiConfig.cloudBackendURL = https://taxiapp-api.onrender.com

services:
  - type: web
    name: taxiapp-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: taxiapp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FLEET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      # Live: https://luckystaxiapp.de (Strato Domain → Render Custom Domain)
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        value: kontakt@luckystaxiapp.de
      - key: GA_MEASUREMENT_ID
        sync: false
      # Phase 1 — optional Realtime / Maps / SMS-OTP
      - key: LOCATION_STREAM_INTERVAL_MS
        value: "2500"
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: OTP_DEV_CODE
        sync: false
      # Phase 3 — Matching / Auto-Dispatch
      - key: MATCH_OFFER_TIMEOUT_MS
        value: "15000"
      - key: MATCH_RADIUS_KM
        value: "15"
      - key: GEOHASH_PRECISION
        value: "6"
      - key: MATCH_AUTO_START
        sync: false
      # Phase 7 — GoBD / Retention
      - key: RECEIPT_VAT_PERCENT
        value: "7"
      - key: LOCATION_RETENTION_SECONDS
        value: "3600"
      - key: RESEND_FROM
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: DRIVER_API_KEY
        sync: false
    # Persistent Disk — Buchungen und Mandanten bleiben nach Deploy erhalten.
    # SSL: Custom Domain im Render-Dashboard (Let's Encrypt automatisch).
    # Multi-Cloud-Alternative: backend/Dockerfile — docs/PHASE-8-DEPLOY-RELEASE.md
