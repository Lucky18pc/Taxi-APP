# TaxiApp Backend — Deploy auf Render.com (Go-Live-Plattform)
# Firebase: nicht verwendet — CollectionShop läuft separat auf Firebase.
# https://render.com/docs/blueprint-spec
#
# 1. Repo auf GitHub pushen → Render deployt automatisch
# 2. Dashboard → taxiapp-api → Environment:
#    ADMIN_PIN=deine-pin          (Leitstelle schützen)
#    DRIVER_API_KEY=dein-key     (Fahrer-App-Endpunkte; muss zur iOS-App passen)
#    STRIPE_SECRET_KEY=sk_test_…  (optional, Kartenzahlung später)
# 3. iOS: TaxiConfig.cloudBackendURL = https://taxiapp-api.onrender.com

services:
  - type: web
    name: taxiapp-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: taxiapp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: DRIVER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
    # Persistent Disk — Buchungen und Mandanten bleiben nach Deploy erhalten.
